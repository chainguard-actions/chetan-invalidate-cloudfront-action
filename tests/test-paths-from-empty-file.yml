name: Test PATHS_FROM with empty file exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake jq-1.6 to prevent wget download
        run: |
          # The action checks if jq --version == "jq-1.6" and downloads if not.
          # Provide a fake jq that reports jq-1.6 so the download is skipped.
          # The action exits 0 before actually calling jq when PATHS is empty.
          sudo tee /usr/local/bin/jq16 > /dev/null << 'EOF'
          #!/bin/sh
          echo "jq-1.6"
          EOF
          sudo chmod 755 /usr/local/bin/jq16
          # Override system jq to report jq-1.6
          sudo tee /usr/local/bin/jq > /dev/null << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "jq-1.6"
            exit 0
          fi
          exec /usr/bin/jq "$@"
          EOF
          sudo chmod 755 /usr/local/bin/jq

      - name: Create an empty PATHS file
        run: |
          touch /tmp/empty-paths-file.txt

      - name: Run action with PATHS_FROM pointing to an empty file
        id: action
        uses: .
        continue-on-error: true
        env:
          DISTRIBUTION: "EXXXXXXXXXXXXX"
          PATHS_FROM: "/tmp/empty-paths-file.txt"
          AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
          AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          AWS_REGION: "us-east-1"

      - name: Assert action succeeded (exits 0 when PATHS file is empty)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (exit 0) when PATHS_FROM file is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly exited 0 when PATHS_FROM file is empty"
