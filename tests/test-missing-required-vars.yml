name: Test missing required env vars causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without any required env vars
        id: action
        uses: .
        continue-on-error: true
        env:
          DISTRIBUTION: ""
          PATHS: ""
          PATHS_FROM: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_REGION: ""

      - name: Assert action failed due to missing required vars
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required env vars are missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required env vars are missing"
