name: Test missing required env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required env vars and capture exit code
        id: action
        uses: .
        continue-on-error: true
        # No env vars set — action should fail with validation errors

      - name: Assert action failed due to missing required vars
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required env vars are missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required env vars are missing"
