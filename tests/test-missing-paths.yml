name: Test missing PATHS and PATHS_FROM env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without PATHS or PATHS_FROM (expect failure)
        id: action
        uses: .
        env:
          DISTRIBUTION: "EDFDVBD6EXAMPLE"
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: "fake-key-id"
          AWS_SECRET_ACCESS_KEY: "fake-secret-key"
        continue-on-error: true

      - name: Assert action failed due to missing PATHS and PATHS_FROM
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither PATHS nor PATHS_FROM is set"
            exit 1
          fi
          echo "PASS: action correctly failed when PATHS and PATHS_FROM are both missing"
