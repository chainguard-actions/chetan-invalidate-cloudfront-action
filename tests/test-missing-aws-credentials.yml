name: Test missing AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without AWS credentials (expect failure)
        id: action
        uses: .
        env:
          DISTRIBUTION: "EDFDVBD6EXAMPLE"
          PATHS: "/index.html"
          AWS_REGION: "us-east-1"
        continue-on-error: true

      - name: Assert action failed due to missing AWS credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AWS credentials are not set"
            exit 1
          fi
          echo "PASS: action correctly failed when AWS credentials are missing"
