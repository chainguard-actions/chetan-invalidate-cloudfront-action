name: Test missing required env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required env vars (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # No DISTRIBUTION, PATHS, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION set

      - name: Assert action failed due to missing env vars
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when required env vars are missing"
            exit 1
          fi
          echo "PASS: action correctly failed when required env vars are missing"
