name: Test missing DISTRIBUTION env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without DISTRIBUTION (expect failure)
        id: action
        uses: .
        env:
          PATHS: "/index.html"
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: "fake-key-id"
          AWS_SECRET_ACCESS_KEY: "fake-secret-key"
        continue-on-error: true

      - name: Assert action failed due to missing DISTRIBUTION
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when DISTRIBUTION is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when DISTRIBUTION is missing"
